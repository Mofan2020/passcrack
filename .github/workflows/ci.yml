name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        run: python -m pip install --upgrade pip && pip install "ruff==0.6.9"
      - name: ruff check
        run: ruff check .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 跑测试
        run: pytest --junitxml=junit.xml
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml

  build:
    name: build (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.10.0 pywebview py7zr pyzipper
      - name: 打包
        run: pyinstaller build/passcrack.spec --noconfirm --clean
      - name: 压缩产物
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent dist/passcrack.app dist/passcrack-macos.zip
          else
            cd dist && 7z a passcrack-windows.zip passcrack.exe
          fi
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: passcrack-${{ matrix.os }}
          path: dist/*.zip
