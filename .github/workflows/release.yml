name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  check:
    name: 版本与说明
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查版本号一致
        run: python scripts/check_version.py "${{ github.event.inputs.tag || github.ref_name }}"
      - name: 检查发布说明里有免责声明
        run: python scripts/check_release_notes.py

  build:
    name: build (${{ matrix.os }})
    needs: [check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.10.0 pywebview py7zr pyzipper
      - name: 打包
        run: pyinstaller build/passcrack.spec --noconfirm --clean
      - name: 压缩产物
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent dist/passcrack.app dist/passcrack-macos.zip
          else
            cd dist && 7z a passcrack-windows.zip passcrack.exe
          fi
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: passcrack-${{ matrix.os }}
          path: dist/*.zip

  release:
    name: 创建发布
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 Release（预发布）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "passcrack $TAG" \
            --notes-file release-notes.md \
            --prerelease \
            artifacts/*.zip
