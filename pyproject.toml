[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passcrack"
version = "0.1.0"
description = "FTP / WiFi / 压缩包的口令恢复工具，仅限自有或已授权的系统"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Skyc8266" }]
keywords = ["password", "recovery", "ftp", "wifi", "wpa2", "archive", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "pywebview>=4.4",
    "py7zr>=0.20",
    "pyzipper>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Mofan2020/passcrack"
Repository = "https://github.com/Mofan2020/passcrack"
Issues = "https://github.com/Mofan2020/passcrack/issues"

[project.scripts]
passcrack = "passcrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passcrack = ["ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM108",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
